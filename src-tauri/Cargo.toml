[package]
name = "agentpets"
description = "AgentPets — AI agent usage monitor & desktop pet"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "agentpets"

[lib]
name = "agentpets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentpets-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[features]
# Serve the bundled ui/ folder (also for plain `cargo build`; there is no dev server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
