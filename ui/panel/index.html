<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>AgentPets</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="../shared/mascots.css" />
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div id="app">
      <aside class="side">
        <div class="logo" data-tauri-drag-region>
          <span class="logo-pet" id="logo-pet"></span>
          <span class="logo-text" data-tauri-drag-region>Agent<br />Pets</span>
        </div>
        <nav id="nav">
          <button data-tab="inventory"><svg viewBox="0 0 24 24"><path d="M6 8h12v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z M9 8V6a3 3 0 0 1 6 0v2 M9 13h6" /></svg>인벤토리</button>
          <button data-tab="collection"><svg viewBox="0 0 24 24"><path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z M5 17a3 3 0 0 1 3-3h9" /></svg>도감</button>
          <button data-tab="synth"><svg viewBox="0 0 24 24"><path d="M11 3l1.8 4.2L17 9l-4.2 1.8L11 15l-1.8-4.2L5 9l4.2-1.8z M18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z" /></svg>합성</button>
          <button data-tab="gacha"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M4 12h16 M10 12a2 2 0 0 0 4 0" /></svg>뽑기</button>
          <button data-tab="usage"><svg viewBox="0 0 24 24"><path d="M4 19h16 M7 16v-5 M12 16V7 M17 16v-8" /></svg>사용량</button>
          <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" /></svg>설정</button>
        </nav>
        <button class="fold" id="btn-fold"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16M18 10l-2 2 2 2" /></svg>접기</button>
      </aside>
      <main class="content">
        <header class="top" data-tauri-drag-region>
          <h1 id="title" data-tauri-drag-region></h1>
          <div class="wallet" title="✦ 스파크 — 에이전트가 처리한 토큰 1,000개마다 1개"><span class="spark">✦</span><b id="wallet">0</b></div>
          <button class="xbtn" id="btn-x" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
        </header>
        <section id="view"></section>
      </main>
      <div id="toast"></div>
      <div id="chart-tip"></div>
    </div>
    <script src="../shared/items.js"></script>
    <script src="../shared/bridge.js"></script>
    <script src="../shared/util.js"></script>
    <script src="../shared/mascots.js"></script>
    <script src="./panel.js"></script>
  </body>
</html>
