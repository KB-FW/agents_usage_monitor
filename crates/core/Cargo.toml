[package]
name = "agentpets-core"
description = "Usage collectors (Claude, Codex, Gemini, Grok) and pet game rules for AgentPets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memchr = "2"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
