<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>AgentMeter 미리보기</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Pretendard Variable', Pretendard, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
        background: #1b1b1b;
        color: #f3f3f3;
        font-size: 13px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background: #242424;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      header b {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        margin-right: 6px;
      }
      header b i {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        background: #f05c1a;
      }
      header small {
        color: #8a8a8a;
        margin-right: auto;
      }
      .grp {
        display: flex;
        gap: 4px;
        align-items: center;
        padding-left: 10px;
        border-left: 1px solid rgba(255, 255, 255, 0.1);
      }
      .grp span {
        font-size: 11.5px;
        color: #8a8a8a;
        margin-right: 2px;
      }
      button {
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 7px;
        padding: 5px 10px;
        background: #333;
        color: #eee;
        cursor: pointer;
      }
      button:hover {
        border-color: #f05c1a;
      }
      main {
        padding: 18px;
        display: grid;
        gap: 18px;
      }
      .cap {
        font-size: 11.5px;
        color: #8a8a8a;
        margin-bottom: 6px;
      }
      .taskbar {
        display: flex;
        align-items: center;
        height: 48px;
        padding: 0 8px;
        background: #202020;
        border-top: 1px solid #333;
      }
      .taskbar .apps {
        display: flex;
        gap: 8px;
        margin-right: auto;
      }
      .taskbar .apps i {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: #3a3a3a;
      }
      .taskbar .clock {
        margin-left: 18px;
        text-align: right;
        font-size: 11px;
        color: #cfcfcf;
        line-height: 1.35;
      }
      .row2 {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      iframe {
        border: 0;
        display: block;
        background: transparent;
      }
      #dash {
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .floatbox {
        padding: 16px;
        border-radius: 12px;
        background: repeating-linear-gradient(45deg, #262626 0 10px, #222 10px 20px);
      }
    </style>
  </head>
  <body>
    <header>
      <b><i></i>AgentMeter 미리보기</b>
      <small>ui/ 파일을 저장하면 바로 반영돼요 · 데모 데이터</small>
      <div class="grp">
        <span>Claude 5H</span>
        <button data-claude="idle">40%</button>
        <button data-claude="work">작업 중</button>
        <button data-claude="fast">85% 소진 예상</button>
        <button data-claude="full">100%</button>
      </div>
      <div class="grp">
        <span>표시</span>
        <button data-set='{"valueMode":"used"}'>사용한 양</button>
        <button data-set='{"valueMode":"remaining"}'>남은 양</button>
        <button data-set='{"resetFormat":"clock"}'>리셋 시각</button>
        <button data-set='{"resetFormat":"relative"}'>남은 시간</button>
      </div>
    </header>
    <main>
      <div>
        <div class="cap">작업표시줄 모드 (작업표시줄 높이 48px)</div>
        <div class="taskbar">
          <div class="apps"><i></i><i></i><i></i><i></i><i></i></div>
          <iframe id="tb" src="/ui/widget/index.html?mode=taskbar&amp;tb=48" height="48" width="900" title="taskbar widget"></iframe>
          <div class="clock" id="clock"></div>
        </div>
      </div>
      <div class="row2">
        <div>
          <div class="cap">이동 모드</div>
          <div class="floatbox"><iframe id="fl" src="/ui/widget/index.html?mode=floating" width="312" height="600" title="floating widget"></iframe></div>
        </div>
        <div>
          <div class="cap">대시보드 (1060×720)</div>
          <iframe id="dash" src="/ui/dashboard/index.html?page=overview" width="1060" height="720" title="dashboard"></iframe>
        </div>
      </div>
    </main>
    <script src="/__dev/dashboard.js"></script>
  </body>
</html>
